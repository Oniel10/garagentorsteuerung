blueprint:
  name: Garage – manueller KNX-Notbetrieb
  description: Ein- und Ausgänge bei der Einrichtung zuordnen.
  domain: script
  source_url: https://github.com/Oniel10/garagentorsteuerung/blob/main/blueprints/script/steuerung.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    permit:
      name: Notbetrieb ausdrücklich freigeben
      selector:
        entity:
          domain: input_boolean
    open_limit:
      name: Unabhängige Endlage AUF
      selector:
        entity:
          domain: [binary_sensor, input_select]
    closed_limit:
      name: Unabhängige Endlage ZU
      selector:
        entity:
          domain: [binary_sensor, input_select]
    motor:
      name: Unabhängiges Motorsignal
      selector:
        entity:
          domain: [binary_sensor, input_select]
    auf_frisch:
      name: Gültigkeit Endlage AUF
      selector:
        entity:
          domain: timer
    zu_frisch:
      name: Gültigkeit Endlage ZU
      selector:
        entity:
          domain: timer
    motor_frisch:
      name: Gültigkeit Motorspannung
      selector:
        entity:
          domain: timer
    loxone_watchdog:
      name: Lebenszeichen-Timer der Hauptsteuerung
      selector:
        entity:
          domain: timer
    up:
      name: KNX-Taster für AUF
      selector:
        entity:
          domain: button
    down:
      name: KNX-Taster für ZU
      selector:
        entity:
          domain: button
mode: single
fields:
  befehl:
    name: Torbefehl
    required: true
    selector:
      select:
        options: [AUF, ZU, STOP]
variables:
  motor_entity: !input motor
  up_limit: !input open_limit
  down_limit: !input closed_limit
sequence:
  - condition: state
    entity_id: !input permit
    state: "on"
  - condition: state
    entity_id: !input loxone_watchdog
    state: "idle"
  - condition: state
    entity_id: !input auf_frisch
    state: "active"
  - condition: state
    entity_id: !input zu_frisch
    state: "active"
  - condition: state
    entity_id: !input motor_frisch
    state: "active"
  - condition: template
    value_template: >
      {{ befehl in ['AUF', 'ZU', 'STOP']
         and states(motor_entity) in ['on', 'off', 'Ein', 'Aus']
         and states(up_limit) in ['on', 'off', 'Ein', 'Aus']
         and states(down_limit) in ['on', 'off', 'Ein', 'Aus']
         and not (states(up_limit) in ['on', 'Ein'] and states(down_limit) in ['on', 'Ein']) }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ befehl == 'STOP' and states(motor_entity) in ['on', 'Ein'] }}"
        sequence:
          - action: button.press
            target:
              entity_id: !input up
      - conditions:
          - condition: template
            value_template: "{{ befehl == 'AUF' and states(motor_entity) in ['off', 'Aus'] and states(up_limit) in ['off', 'Aus'] }}"
        sequence:
          - action: button.press
            target:
              entity_id: !input up
      - conditions:
          - condition: template
            value_template: "{{ befehl == 'ZU' and states(motor_entity) in ['off', 'Aus'] and states(down_limit) in ['off', 'Aus'] }}"
        sequence:
          - action: button.press
            target:
              entity_id: !input down
