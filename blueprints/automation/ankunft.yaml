blueprint:
  name: Garage – einmal bei Ankunft öffnen
  description: Pro berechtigtem Konto eine Instanz einrichten.
  domain: automation
  source_url: https://github.com/Oniel10/garagentorsteuerung/blob/main/blueprints/automation/ankunft.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    person:
      name: Anwesenheit
      selector:
        entity:
          domain: person
    button:
      name: Vormerkbutton
      selector:
        entity:
          domain: input_button
    freigabe:
      name: Konto zur Ankunftsöffnung berechtigen
      default: false
      selector:
        boolean: {}
    armed:
      name: Persönliche Vormerkung
      selector:
        entity:
          domain: input_boolean
    watchdog:
      name: Loxone-Lebenszeichen
      selector:
        entity:
          domain: timer
    status:
      name: Torstatus
      selector:
        entity:
          domain: input_select
    command:
      name: Garagenbefehl
      selector:
        entity:
          domain: script
    account:
      name: HA-Benutzer-ID der Person
      selector:
        text: {}
mode: single
max_exceeded: silent
variables:
  account_id: !input account
  permission: !input freigabe
triggers:
  - trigger: state
    entity_id: !input button
    not_to: [unknown, unavailable]
conditions:
  - condition: template
    value_template: >-
      {{ permission and trigger is defined and trigger.platform == 'state'
         and trigger.to_state is not none
         and trigger.to_state.context.user_id == account_id }}
actions:
  - condition: template
    value_template: >-
      {{ permission and trigger is defined and trigger.platform == 'state'
         and trigger.to_state is not none
         and trigger.to_state.context.user_id == account_id }}
  - action: input_boolean.turn_on
    target:
      entity_id: !input armed
  - wait_for_trigger:
      - trigger: state
        entity_id: !input person
        not_from: [home, unknown, unavailable]
        to: home
    timeout: "24:00:00"
  - action: input_boolean.turn_off
    target:
      entity_id: !input armed
  - condition: template
    value_template: "{{ wait.completed }}"
  - condition: state
    entity_id: !input watchdog
    state: active
  - condition: state
    entity_id: !input status
    state: Geschlossen
  - action: script.turn_on
    target:
      entity_id: !input command
    data:
      variables:
        befehl: auf
